# Alembic configuration for UA Cyber Threat Dashboard
# (миграції, зокрема створення таблиці ddos_snapshots для Cloudflare Radar)

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url береться з env.py (змінна DATABASE_URL із .env),
# тут лишаємо дефолт для локального запуску без env:
sqlalchemy.url = sqlite:///./data/threats.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
